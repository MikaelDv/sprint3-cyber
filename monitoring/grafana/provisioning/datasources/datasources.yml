apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: MySQL (audit_log)
    uid: mysql
    type: mysql
    url: mysql:3306
    user: grafana_ro
    jsonData:
      database: carsearch
      # audit_log.ocorrido_em é gravado no horário local da API (America/Sao_Paulo)
      timezone: "-03:00"
      maxOpenConns: 5
    secureJsonData:
      password: $GRAFANA_MYSQL_PASSWORD
