spring.application.name=challengeFord

# ============================
# Servidor / TLS
# ============================
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SERVER_SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:challenge-ford}
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# Limites para mitigar payload flooding / buffer overflow
server.max-http-request-header-size=8KB
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
server.tomcat.max-http-form-post-size=256KB
server.tomcat.max-swallow-size=2MB

# Esconde tecnologia em headers
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# ============================
# Datasource
# ============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ============================
# Gemini API
# ============================
gemini.api.key=${GEMINI_API_KEY:}

# ============================
# JWT
# ============================
# Chave em Base64 (256 bits) - troque em produção
security.jwt.secret=${JWT_SECRET:Q0hBTkdFLU1FLVNVUEVSLVNFQ1JFVC1LRVktMzItQllURVMtTUlOSU1VTQ==}
security.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL:15}
security.jwt.refresh-token-ttl-minutes=${JWT_REFRESH_TTL:1440}
security.jwt.issuer=challenge-ford

# ============================
# Criptografia AES-GCM (dados em repouso)
# ============================
security.encryption.aes-key=${AES_KEY:UENob3VyLVN1cGVyLVNlY3JldC1FbmNyeXB0aW9u}

# ============================
# Assinatura HMAC de payloads
# ============================
security.hmac.secret=${HMAC_SECRET:cGxlYXNlLWNoYW5nZS1tZS1obWFjLXNlY3JldA==}
security.hmac.required-paths=/veiculos/consultar
security.hmac.header=X-Payload-Signature
security.hmac.timestamp-header=X-Payload-Timestamp
security.hmac.max-skew-seconds=300

# ============================
# Rate limiting
# ============================
security.rate-limit.capacity=60
security.rate-limit.refill-tokens=60
security.rate-limit.refill-period-seconds=60
security.rate-limit.login-capacity=5
security.rate-limit.login-refill-period-seconds=60

# ============================
# CORS
# ============================
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://app.challenge-ford.local}
security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
security.cors.allowed-headers=Authorization,Content-Type,X-Payload-Signature,X-Payload-Timestamp,X-Request-Id
security.cors.allow-credentials=true
security.cors.max-age=3600

# ============================
# Bootstrap do primeiro ADMIN (executa só se a tabela usuarios estiver vazia)
# ============================
security.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
security.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
security.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@challenge-ford.local}
security.bootstrap.admin.nome=${BOOTSTRAP_ADMIN_NOME:Administrador}
security.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@2026Senha!}

# ============================
# Retenção de dados
# ============================
security.retention.audit-days=180
security.retention.veiculo-stale-days=730

# ============================
# Actuator (mínimo necessário)
# ============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator
management.info.env.enabled=false

# ============================
# Logging seguro
# ============================
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.br.com.challenge2026=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} - %msg%n

# Swagger acessível apenas em perfil dev
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
